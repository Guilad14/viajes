<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#163e3d"><meta name="description" content="Organizá expediciones de montaña"><link rel="manifest" href="./manifest.webmanifest"><link rel="icon" href="./icon.svg" type="image/svg+xml"><title>Mi Expedición</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzxQpqGq69hFhX+7ovygIuR1J3FjU=" crossorigin="">
<style>
:root{--dark:#123b3c;--ink:#183137;--muted:#657780;--bg:#f5f7f6;--line:#e4eae7;--teal:#1c746d;--pale:#e7f1ed;--gold:#d59c4a}*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:ui-sans-serif,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:var(--ink);background:var(--bg)}button,input,textarea{font:inherit}button{cursor:pointer}button:disabled{opacity:.48;cursor:not-allowed}a{color:var(--teal)}.app{max-width:780px;margin:auto;min-height:100vh;padding-bottom:86px}.top{background:var(--dark);color:white;padding:20px 21px 18px;display:flex;justify-content:space-between;align-items:center}.logo{font-size:20px;font-weight:800;display:flex;gap:9px;align-items:center}.logo svg{width:30px;height:30px}.avatar{border-radius:50%;background:#ffffff24;padding:9px 11px;font-size:12px;font-weight:800}.content{padding:20px 17px}.greeting{font-size:14px;color:var(--muted);margin:4px 2px 14px}.heading{font-size:25px;margin:0 0 8px;letter-spacing:-.7px}.hero{position:relative;overflow:hidden;min-height:242px;background:linear-gradient(155deg,#9fbbc0,#365e68);border-radius:20px;color:#fff;box-shadow:0 9px 22px #0c4b4719}.hero svg{position:absolute;inset:0;width:100%;height:100%}.hero:after{content:"";position:absolute;inset:0;background:linear-gradient(0deg,rgba(6,30,33,.91) 0%,rgba(7,31,36,.03) 68%)}.hero-txt{position:absolute;bottom:18px;left:20px;right:20px;z-index:1}.hero h2{font-size:29px;line-height:1.1;margin:8px 0}.hero p{margin:6px 0;font-size:13px;color:#e9f4ef}.pill{display:inline-block;font-size:11px;background:#ffffff29;border:1px solid #ffffff59;padding:5px 9px;border-radius:99px;backdrop-filter:blur(6px)}.section-head{display:flex;align-items:center;justify-content:space-between;margin:25px 2px 13px}.section-head h3{font-size:18px;margin:0}.section-head small{color:var(--muted)}.tiles{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.tile{border:1px solid var(--line);background:white;border-radius:17px;padding:18px 13px;text-align:left;display:flex;flex-direction:column;align-items:flex-start;gap:6px;min-height:130px;box-shadow:0 3px 14px #203c3910;transition:transform .15s}.tile:active{transform:scale(.97)}.tile-icon{width:40px;height:40px;background:var(--pale);border-radius:12px;display:grid;place-items:center;font-size:21px;margin-bottom:2px}.tile b{font-size:14px}.tile span:last-child{font-size:11px;color:var(--muted)}.panel{background:white;border:1px solid var(--line);border-radius:18px;padding:19px;box-shadow:0 3px 14px #203c390d}.panel h2{margin:0 0 10px;font-size:21px}.panel h3{font-size:16px;margin:20px 0 10px}.small{color:var(--muted);font-size:13px;line-height:1.55}.muted{color:var(--muted)}.btn{background:var(--dark);border:0;border-radius:12px;color:white;font-weight:700;padding:13px 16px;display:inline-flex;justify-content:center;align-items:center;gap:8px;text-decoration:none}.btn-outline{background:white;color:var(--dark);border:1px solid var(--line)}.btn-sm{padding:9px 12px;font-size:12px}.full{width:100%}.back{border:0;background:none;color:var(--dark);font-weight:700;padding:5px 0 14px}.field{display:block;margin:14px 0 5px;font-size:13px;font-weight:700}.input{border:1px solid #d7e0dc;border-radius:11px;padding:12px;width:100%;background:white;outline:none}.input:focus{border-color:var(--teal)}.login{max-width:440px;margin:34px auto}.login-icon{font-size:38px;margin-bottom:12px}.note{background:#ecf5f1;color:#29574e;border-radius:12px;padding:13px;margin-top:18px;font-size:12px;line-height:1.5}.check{display:flex;gap:11px;align-items:center;border-bottom:1px solid var(--line);padding:12px 0;font-size:14px}.check input{width:19px;height:19px;accent-color:#287f6e}.check:has(input:checked) span{text-decoration:line-through;color:#7b8c8a}.bar{height:9px;background:#edf0ee;border-radius:9px;overflow:hidden;margin:12px 0}.bar>div{height:100%;background:#399477;border-radius:9px;transition:width .2s}.row{display:flex;gap:9px;align-items:center}.row .input{flex:1;min-width:0}.tag{font-size:11px;font-weight:700;padding:5px 8px;background:#ecf3ef;color:#24694b;border-radius:7px}.timeline{border-left:2px solid #d1e7dd;margin-left:7px;padding-left:22px}.event{position:relative;padding:2px 0 18px}.event:before{content:"";width:10px;height:10px;border-radius:50%;position:absolute;left:-28px;top:7px;background:#3a9377}.event b{font-size:14px}.event p{font-size:13px;color:var(--muted);margin:7px 0}.details{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:14px 0}.detail{padding:12px;border-radius:12px;background:#f4f7f5}.detail small{display:block;color:var(--muted);font-size:11px}.detail strong{display:block;margin-top:4px;font-size:15px}.linkrow{padding:14px 0;border-bottom:1px solid var(--line)}.linkrow a{font-weight:700}.map{height:310px;border-radius:14px;margin:15px 0;background:#dce8e6;overflow:hidden}.point{border-bottom:1px solid var(--line);padding:10px 0;display:flex;align-items:center;gap:8px;justify-content:space-between;font-size:13px}.elev{width:100%;height:125px;background:#f3f7f5;border-radius:12px}.bottom{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid var(--line);height:66px;display:flex;justify-content:center;gap:10px;z-index:1000;padding-bottom:env(safe-area-inset-bottom)}.nav{border:0;background:none;color:#81918f;display:flex;align-items:center;flex-direction:column;gap:3px;padding:10px;font-size:11px}.nav i{font-style:normal;font-size:21px}.nav.active{color:var(--teal);font-weight:700}.disclaimer{font-size:11px;color:#82928f;margin:14px 0}.route-warning{background:#fff6e7;color:#855d2d;padding:11px;border-radius:9px;font-size:12px;margin-top:10px}@media(min-width:700px){.hero{min-height:300px}.tiles{grid-template-columns:repeat(3,1fr)}.content{padding:25px}}
</style>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin="" defer></script></head>
<body><div class="app"><header class="top"><div class="logo"><svg viewBox="0 0 48 48" fill="none" stroke="white" stroke-width="3" stroke-linejoin="round"><path d="M3 37 17 15l7 11 7-15 14 26H3Z"/><path d="m12 23 5 3 4-4m6-4 4 3 4-3"/></svg>Mi Expedición</div><div id="avatar" class="avatar">⛰</div></header><div id="app" class="content"></div><nav class="bottom"><button class="nav active" onclick="go('home')"><i>⌂</i>Inicio</button><button class="nav" onclick="go('home')"><i>△</i>Expedición</button><button class="nav" onclick="go('info')"><i>◉</i>Información</button><button class="nav" onclick="go('admin')"><i>⚙</i>Admin demo</button></nav></div>
<script>
const $=id=>document.getElementById(id),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const mods=[['gear','🎒','Mi equipo','Checklist personal'],['meeting','📍','Punto de encuentro','Ubicación y horario'],['schedule','🗓️','Cronograma','Actividades y lectura'],['route','🧭','Ruta','Mapa y GPX'],['links','🔗','Links de interés','Recursos útiles'],['info','ℹ️','Información','Detalles de la salida']];
const required=lines(cfg.mandatory),optional=lines(cfg.optional);
let cfg=JSON.parse(localStorage.getItem('mi_exp_admin_cfg')||'null')||{title:'Volcán Lanín',place:'Neuquén, Argentina',date:'Diciembre 2026',meeting:'San Martín de los Andes, Neuquén',when:'26 de diciembre de 2026, 08:00',instructions:'Llegar con tiempo y equipo preparado',mandatory:'Mochila de montaña\nBotas de montaña\nCampera impermeable\nLinterna frontal\nGuantes de abrigo\nBolsa de dormir',optional:'Bastones de trekking\nGorro y buff\nCámara de fotos',schedule:'Día 1 — Aproximación | Encuentro e inicio de la caminata\nDía 2 — Cumbre | Ascenso según condiciones\nDía 3 — Descenso | Regreso',links:'Servicio Meteorológico Nacional | https://www.smn.gob.ar/\nParques Nacionales | https://www.argentina.gob.ar/parquesnacionales'};function cfgSave(){['title','place','date','meeting','when','instructions','mandatory','optional','schedule','links'].forEach(k=>cfg[k]=document.getElementById('cfg_'+k).value);localStorage.setItem('mi_exp_admin_cfg',JSON.stringify(cfg));alert('Cambios guardados en este dispositivo (demo).');go('admin')}function lines(x){return String(x||'').split(/\r?\n/).map(x=>x.trim()).filter(Boolean)}function admin(){let fields=[['title','Nombre de expedición'],['place','Región / lugar'],['date','Fecha'],['meeting','Punto de encuentro'],['when','Fecha y hora de encuentro'],['instructions','Indicaciones'],['mandatory','Equipo obligatorio (uno por línea)'],['optional','Equipo opcional (uno por línea)'],['schedule','Cronograma (actividad | descripción)'],['links','Links (título | URL)']];return shell('⚙️ Panel de administrador — Demo','<div class="note"><b>Demostración sin autenticación.</b> Cualquiera puede abrir esta pantalla, pero cada persona edita únicamente su propia copia local. No se publican cambios para los demás ni se guardan en un servidor.</div>'+fields.map(([k,label])=>'<label class="field" for="cfg_'+k+'">'+label+'</label>'+( ['mandatory','optional','schedule','links','instructions'].includes(k)?'<textarea id="cfg_'+k+'" class="input" rows="4">'+esc(cfg[k])+'</textarea>':'<input id="cfg_'+k+'" class="input" value="'+esc(cfg[k])+'">')).join('')+'<p>'+button('Guardar cambios de la demo','cfgSave()')+'</p><p class="disclaimer">Próxima etapa: acceso exclusivo para vos, base de datos y publicación de cambios compartidos.</p>')}let name=localStorage.getItem('exp_name')||'',page='home',extra=JSON.parse(localStorage.getItem('exp_extra')||'[]'),done=JSON.parse(localStorage.getItem('exp_done')||'{}'),read=localStorage.getItem('exp_read')==='yes',gpxText='',route=[],pois=[],map;
const mountain='<svg viewBox="0 0 700 360" preserveAspectRatio="xMidYMid slice" aria-hidden="true"><defs><linearGradient id="sky" x2="0" y2="1"><stop stop-color="#83bacb"/><stop offset="1" stop-color="#d8e6db"/></linearGradient></defs><path fill="url(#sky)" d="M0 0h700v360H0z"/><circle cx="559" cy="77" r="37" fill="#f7e8c5" opacity=".65"/><path fill="#668e94" d="M0 234 120 137l65 55L304 64 455 244l99-116L700 256v104H0z"/><path fill="#dbe8e7" d="m205 181 99-117 91 109-37-12-31-44-23 21-23-20-34 50z"/><path fill="#416e70" d="m0 294 105-76 84 65 88-40 95 65 101-87 111 68 116-37v108H0z"/><path fill="#214b4d" d="m0 323 109-56 83 42 107-39 87 49 104-26 90 25 120-39v81H0z"/></svg>';
function store(){localStorage.setItem('exp_done',JSON.stringify(done));localStorage.setItem('exp_extra',JSON.stringify(extra))}
function go(p){page=p;render();window.scrollTo(0,0)}function button(txt,fn,cls='btn full'){return '<button class="'+cls+'" onclick="'+fn+'">'+txt+'</button>'}
function hero(){return '<div class="hero">'+mountain+'<div class="hero-txt"><span class="pill">🏔 Expedición de ejemplo</span><h2>'+esc(cfg.title)+'</h2><p>📍 '+esc(cfg.place)+' &nbsp; • &nbsp; '+esc(cfg.date)+'</p></div></div>'}
function login(){return '<section class="panel login"><div class="login-icon">🏔️</div><h2>¡Bienvenido a la aventura!</h2><p class="small">Ingresá tu nombre y un código de invitación para explorar la demo.</p><label class="field" for="nm">Nombre y apellido</label><input class="input" id="nm" placeholder="Ej. Juan Pérez" value="'+esc(name)+'"><label class="field" for="cd">Código de invitación</label><input class="input" id="cd" placeholder="Ej. LANIN-2026"><p>'+button('Ingresar a mi expedición','enter()')+'</p><div class="note">🧪 Demo: se admite cualquier código. El acceso por invitación y los permisos reales se implementarán con la base de datos.</div></section>'}
function home(){return '<div class="greeting">¡Hola, <b>'+esc(name)+'</b>! 👋</div>'+hero()+'<div class="section-head"><h3>Tu expedición</h3><small>6 secciones</small></div><div class="tiles">'+mods.map(x=>'<button class="tile" onclick="go(\''+x[0]+'\')"><span class="tile-icon">'+x[1]+'</span><b>'+x[2]+'</b><span>'+x[3]+'</span></button>').join('')+'</div><div class="note">Tené tu equipo y toda la información de la salida a mano. Esta versión es una demostración con datos ficticios.</div><p style="margin-top:20px;text-align:center">'+button('Cambiar participante','logout()','btn btn-outline btn-sm')+'</p>'}
function enter(){const n=$('nm').value.trim(),c=$('cd').value.trim();if(!n||!c){alert('Ingresá tu nombre y un código.');return}name=n;localStorage.setItem('exp_name',n);go('home')}function logout(){name='';localStorage.removeItem('exp_name');go('home')}
function shell(title,body){return '<button class="back" onclick="go(\'home\')">← Volver a la expedición</button><section class="panel"><h2>'+title+'</h2>'+body+'</section>'}
function gear(){let n=required.filter(x=>done[x]).length;const group=(xs)=>xs.map(x=>'<label class="check"><input type="checkbox" '+(done[x]?'checked':'')+' onchange="toggle(\''+esc(x).replace(/'/g,"\\'")+'\')"><span>'+esc(x)+'</span></label>').join('');return shell('🎒 Mi equipo','<div class="details"><div class="detail"><small>Equipo obligatorio</small><strong>'+n+'/'+required.length+' listo</strong></div><div class="detail"><small>Preparación</small><strong>'+Math.round(n/required.length*100)+'%</strong></div></div><div class="bar"><div style="width:'+(n/required.length*100)+'%"></div></div><h3>Obligatorios <span class="tag">Requeridos</span></h3>'+group(required)+'<h3>Opcionales <span class="tag">Recomendados</span></h3>'+group(optional)+'<h3>Mis elementos personales</h3>'+group(extra)+extra.map(x=>'<button class="btn btn-outline btn-sm" style="margin:6px" onclick="removeExtra(\''+esc(x).replace(/'/g,"\\'")+'\')">Quitar '+esc(x)+'</button>').join('')+'<div class="row"><input id="newExtra" class="input" placeholder="Agregar elemento"><button class="btn" onclick="addExtra()">+</button></div><p class="disclaimer">Tus cambios quedan guardados solamente en este navegador, en esta demo.</p>')}
function toggle(x){done[x]=!done[x];store();go('gear')}function addExtra(){let v=$('newExtra').value.trim();if(!v||extra.includes(v))return;extra.push(v);store();go('gear')}function removeExtra(x){extra=extra.filter(v=>v!==x);delete done[x];store();go('gear')}
function schedule(){return shell('🗓️ Cronograma','<p class="small">Cronograma de demostración, no validado para una salida real.</p><div class="timeline">'+lines(cfg.schedule).map(line=>{let [title,desc]=line.split('|');return '<div class="event"><b>'+esc(title||'')+'</b><p>'+esc(desc||'')+'</p></div>'}).join('')+'</div>'+button(read?'✓ Lectura confirmada':'✓ Leí y confirmo el cronograma','confirmRead()','btn full'+(read?' btn-outline':''))+'<p class="disclaimer">La confirmación se guarda solo en este navegador.</p>')}
function confirmRead(){read=true;localStorage.setItem('exp_read','yes');go('schedule')}
function meeting(){return shell('📍 Punto de encuentro','<p class="small">Información editable en Admin demo, guardada localmente.</p><h3>Fecha y horario</h3><p>'+esc(cfg.when)+'</p><h3>Lugar</h3><p>'+esc(cfg.meeting)+'</p><h3>Indicaciones</h3><p class="small">'+esc(cfg.instructions)+'</p><a class="btn full" target="_blank" rel="noopener" href="https://www.google.com/maps/search/?api=1&query='+encodeURIComponent(cfg.meeting)+'">Abrir ubicación en Google Maps ↗</a>')}
function links(){return shell('🔗 Links de interés','<p class="small">Enlaces configurados en este dispositivo.</p>'+lines(cfg.links).map(line=>{let [t,url]=line.split('|').map(x=>x.trim());return '<div class="linkrow"><a target="_blank" rel="noopener noreferrer" href="'+esc(/^https:\/\//i.test(url||'')?url:'#')+'">🔗 '+esc(t)+' ↗</a></div>'}).join(''))}
function info(){return shell('ℹ️ Información','<p>Bienvenido/a a <strong>Mi Expedición</strong>, una plataforma para organizar salidas a la montaña.</p><h3>Volcán Lanín — Expedición de ejemplo</h3><p class="small">Consultá la checklist de equipo, el cronograma, el punto de encuentro, la ruta y los links de interés.</p><div class="note">⚠️ Los datos de esta demo no deben usarse para planificar una ascensión real. Antes de salir, verificá permisos, pronóstico, estado de la ruta y condiciones de seguridad.</div><h3>Sobre esta versión</h3><p class="small">No hay servidor ni cuentas reales. No ingreses datos sensibles. La autenticación del organizador y la privacidad de participantes son funciones pendientes.</p>')}
function hav(a,b){const R=6371,t=x=>x*Math.PI/180,dLat=t(b.lat-a.lat),dLon=t(b.lon-a.lon);return 2*R*Math.asin(Math.sqrt(Math.sin(dLat/2)**2+Math.cos(t(a.lat))*Math.cos(t(b.lat))*Math.sin(dLon/2)**2))}
function stats(){let km=0,up=0,down=0;for(let i=1;i<route.length;i++){km+=hav(route[i-1],route[i]);let d=route[i].ele-route[i-1].ele;if(Number.isFinite(d)&&Number.isFinite(route[i-1].ele)){if(d>0)up+=d;else down-=d}}const valid=route.some(x=>Number.isFinite(x.ele));return {km,up,down,valid}}
function routePage(){let s=stats();let body='<p class="small">Cargá un GPX de ejemplo para explorar el trazado, las estadísticas y sus puntos de interés. En la versión final solo el organizador podrá publicarlo.</p><label class="field" for="gpx">Archivo GPX (demo local)</label><input id="gpx" type="file" accept=".gpx,application/gpx+xml,application/xml,text/xml" class="input" onchange="loadGPX(event)"><div id="map" class="map"></div>';if(route.length){body+='<div class="details"><div class="detail"><small>Distancia</small><strong>'+s.km.toFixed(1)+' km</strong></div><div class="detail"><small>Desnivel + / -</small><strong>'+(s.valid?Math.round(s.up)+' / '+Math.round(s.down)+' m':'Sin elevación')+'</strong></div></div><h3>Perfil de elevación</h3><div id="profile">'+elevationSvg()+'</div>'+button('↓ Descargar GPX','downloadGPX()','btn btn-outline full')+'<h3>Puntos de interés <span class="tag">'+pois.length+'</span></h3><p class="small">Se importan desde el GPX. También podés tocar el mapa para agregar un punto de ejemplo.</p>'+pois.map((p,i)=>'<div class="point"><span>📍 '+esc(p.name)+'</span><span><button class="btn btn-outline btn-sm" onclick="renamePoi('+i+')">Editar</button> <button class="btn btn-outline btn-sm" onclick="deletePoi('+i+')">✕</button></span></div>').join('')}else body+='<p class="small">Todavía no hay un recorrido cargado. El mapa se centrará en la región del Lanín solo como referencia geográfica.</p>';body+='<p class="route-warning">⚠️ Este mapa no reemplaza cartas, GPS, navegación offline ni la verificación del terreno. Los cambios son temporales en esta demo.</p>';return shell('🧭 Ruta y GPX',body)}
function elevationSvg(){let arr=route.filter(x=>Number.isFinite(x.ele));if(arr.length<2)return '<p class="small">El GPX no contiene alturas suficientes para generar el perfil.</p>';let vals=arr.map(x=>x.ele),mn=Math.min(...vals),mx=Math.max(...vals),range=Math.max(1,mx-mn);let stride=Math.max(1,Math.floor(vals.length/120));let v=vals.filter((_,i)=>i%stride===0);let poly=v.map((ele,i)=>(12+i*576/Math.max(1,v.length-1)).toFixed(1)+','+(108-(ele-mn)/range*89).toFixed(1)).join(' ');return '<svg class="elev" viewBox="0 0 600 125" role="img" aria-label="Perfil de elevación de la ruta"><line x1="10" y1="109" x2="590" y2="109" stroke="#a0b3ac"/><polyline points="'+poly+'" fill="none" stroke="#23806c" stroke-width="3" stroke-linejoin="round"/><text x="14" y="17" font-size="12" fill="#527168">'+Math.round(mx)+' m</text><text x="14" y="121" font-size="12" fill="#527168">'+Math.round(mn)+' m</text></svg>'}
function child(n,t){return n.getElementsByTagName(t)[0]?.textContent||''}function loadGPX(e){let f=e.target.files[0];if(!f)return;f.text().then(t=>{let xml=new DOMParser().parseFromString(t,'application/xml');if(xml.querySelector('parsererror')){alert('El archivo GPX no es válido.');return}let trs=[...xml.querySelectorAll('trkpt')];if(!trs.length)trs=[...xml.querySelectorAll('rtept')];if(trs.length<2){alert('El GPX necesita al menos dos puntos de ruta.');return}route=trs.map(n=>({lat:Number(n.getAttribute('lat')),lon:Number(n.getAttribute('lon')),ele:child(n,'ele')?Number(child(n,'ele')):NaN})).filter(n=>Number.isFinite(n.lat)&&Number.isFinite(n.lon));if(route.length<2){alert('No hay coordenadas válidas.');return}pois=[...xml.querySelectorAll('wpt')].map(n=>({name:child(n,'name')||'Punto de interés',lat:Number(n.getAttribute('lat')),lon:Number(n.getAttribute('lon'))})).filter(n=>Number.isFinite(n.lat)&&Number.isFinite(n.lon));gpxText=t;go('route')}).catch(()=>alert('No se pudo leer el archivo'))}
function downloadGPX(){if(!gpxText)return;let a=document.createElement('a'),url=URL.createObjectURL(new Blob([gpxText],{type:'application/gpx+xml'}));a.href=url;a.download='ruta-expedicion.gpx';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)}
function renamePoi(i){let name=prompt('Nombre del punto',pois[i].name);if(name&&name.trim()){pois[i].name=name.trim();go('route')}}function deletePoi(i){pois.splice(i,1);go('route')}
function makeMap(){const el=$('map');if(!el||typeof L==='undefined')return;map=L.map(el,{scrollWheelZoom:false}).setView([-39.64,-71.50],10);L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:18,attribution:'&copy; OpenStreetMap contributors'}).addTo(map);if(route.length){let poly=L.polyline(route.map(p=>[p.lat,p.lon]),{color:'#e06744',weight:4}).addTo(map);map.fitBounds(poly.getBounds(),{padding:[25,25]});pois.forEach(p=>L.marker([p.lat,p.lon]).addTo(map).bindPopup(esc(p.name)));map.on('click',e=>{let name=prompt('Nombre del nuevo punto de interés');if(name&&name.trim()){pois.push({name:name.trim(),lat:e.latlng.lat,lon:e.latlng.lng});go('route')}})}setTimeout(()=>map?.invalidateSize(),200)}
function render(){if(map){map.remove();map=null}let a=$('app');$('avatar').textContent=name?name.trim().split(/\s+/).slice(0,2).map(s=>s[0]?.toUpperCase()).join(''):'⛰';a.innerHTML=page==='admin'?admin():!name?login():page==='home'?home():page==='gear'?gear():page==='meeting'?meeting():page==='schedule'?schedule():page==='route'?routePage():page==='links'?links():info();document.querySelectorAll('.nav').forEach((el,i)=>el.classList.toggle('active',i===(page==='admin'?3:page==='info'?2:page==='home'?0:1)));if(page==='route'&&name)setTimeout(makeMap,50)}
render();if('serviceWorker'in navigator)window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}));
</script></body></html>
