<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Recuperar Mi Expedición</title><style>body{font:16px system-ui;background:#f5f7f6;color:#123b3c;max-width:480px;margin:60px auto;padding:20px}button{background:#123b3c;color:#fff;padding:14px;border:0;border-radius:12px;font-weight:700}</style></head><body><h1>🏔️ Mi Expedición</h1><p>Vamos a limpiar la versión anterior almacenada en este navegador y abrir la aplicación restaurada.</p><button id="go">Restaurar visualización</button><p id="status"></p><script>document.getElementById('go').onclick=async()=>{const out=document.getElementById('status');out.textContent='Actualizando archivos…';try{if('serviceWorker'in navigator){const regs=await navigator.serviceWorker.getRegistrations();await Promise.all(regs.filter(r=>r.scope.includes('/viajes/')).map(r=>r.unregister()))}if('caches'in window){const keys=await caches.keys();await Promise.all(keys.filter(k=>/expedicion|viajes|workbox|precache/i.test(k)).map(k=>caches.delete(k)))}out.textContent='Listo. Abriendo la aplicación…';location.replace('./index.html?restored=20261117')}catch(e){out.textContent='No se pudo limpiar automáticamente. Probá desde una pestaña privada.'}}</script></body></html>
